{% extends "base.html" %}

{% block title %}{{ section.title }} — {{ config.title }}{% endblock title %}

{% block content %}
  <h1>{{ section.title }}</h1>
  {{ section.content | safe }}

  <ul>
    {% for project in section.pages %}
      <li>
        <a href="{{ project.permalink }}">{{ project.title }}</a>
      </li>
    {% endfor %}
  </ul>
{% endblock content %}
